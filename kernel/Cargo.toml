[package]
name = "kernel"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
# Defines how the bootloader hands control (and boot information) to us.
bootloader_api = "0.11"
# Bitmap font. size_20 = bigger, readable text; bold = for headings.
noto-sans-mono-bitmap = { version = "0.3", features = ["size_20", "bold"] }
# The heap allocator algorithm (keeps a linked list of free memory blocks).
linked_list_allocator = "0.10"
# CPU structures like the interrupt table (IDT), and interrupt instructions.
x86_64 = "0.15"
# Driver for the 8259 interrupt controller (PIC).
pic8259 = "0.11"
# Simple locks and lazy initialisation that work without an OS.
spin = "0.9"
